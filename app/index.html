<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KairosBets" />
  <meta name="robots" content="noindex" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/favicon.ico" sizes="48x48" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Chivo+Mono:wght@400;500&family=Chivo:wght@400;500&family=Playfair+Display:ital,wght@0,900;1,700&family=Lora:ital@0;1&display=swap" />
  <title>KairosBets</title>
  <style>
    html, body { margin: 0; background: #0b0b0c; }
    /* Intro (Javi, 06-oct): el logo entra con un pequeño zoom y su brillo, sale el nombre y a los ~1,7 s entra la app */
    #splash { position: fixed; inset: 0; background: #0b0b0c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; z-index: 9999; transition: opacity .45s ease; }
    #splash img { width: min(58vw, 240px); height: auto; animation: kb-entra .9s cubic-bezier(.2, .8, .2, 1) both, kb-brillo 1.8s ease-in-out .5s both; }
    #splash .nombre { font: 800 28px/1 "Big Shoulders Display", "Arial Narrow", sans-serif; letter-spacing: 6px; color: #ffb21a; animation: kb-sube .7s .45s ease-out both; }
    #splash.fuera { opacity: 0; pointer-events: none; }
    @keyframes kb-entra { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes kb-brillo { 0%, 100% { filter: drop-shadow(0 0 0 rgba(255, 178, 26, 0)); } 50% { filter: drop-shadow(0 0 26px rgba(255, 178, 26, .45)); } }
    @keyframes kb-sube { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { #splash img, #splash .nombre { animation: none; } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/logo-480.webp" width="240" height="240" alt="" /><div class="nombre">KAIROSBETS</div></div>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
