<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#0c0e18"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="KairosBets"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="icon" href="public/icons/icon-192.png"/>
  <title>KairosBets</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100dvh;background:#0c0e18;overflow:hidden}
    #splash{position:fixed;inset:0;background:#0c0e18;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity 0.4s}
    #splash img{width:80px;height:80px;border-radius:20px}
    #splash p{color:rgba(255,255,255,0.3);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-family:sans-serif}
  </style>
</head>
<body>
  <div id="splash">
    <img src="public/icons/icon-192.png" alt="KairosBets"/>
    <p>Cargando...</p>
  </div>
  <div id="root"></div>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    window.storage={
      get:async(k)=>{try{const v=localStorage.getItem(k);return v?{value:v}:null;}catch{return null;}},
      set:async(k,v)=>{try{localStorage.setItem(k,v);return{key:k,value:v};}catch{return null;}}
    };
  </script>
  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;
const LOGO = "public/icons/icon-192.png";
const INITIAL_BANKROLL = 15;
const HISTORICAL = [
  { id:"h1",date:"2026-02-24",type:"Combinada",desc:"Burton gana (3.20) × Bradford empate (3.50) × Inter empate descanso (3.20)",odds:35.84,stake:15,result:"cashout",pl:59.16,notes:"Cash out anticipado." },
  { id:"h2",date:"2026-02-25",type:"Simple",desc:"Monaco DC X2 vs PSG",odds:2.20,stake:15,result:"win",pl:18.00,notes:"Monaco 0-1 HT. PSG empató 2-2." },
  { id:"h3",date:"2026-02-26",type:"Combinada",desc:"Jagiellonia X2 (2.50) × Fenerbahce X2 (2.30)",odds:5.75,stake:15,result:"win",pl:68.47,notes:"" },
  { id:"h4",date:"2026-02-28",type:"Combinada",desc:"Liverpool BTTS (1.61) × Barcelona +3.5 (1.66) × Man City gana (1.66)",odds:4.44,stake:15,result:"win",pl:50.94,notes:"" },
  { id:"h5",date:"2026-03-01",type:"Combinada",desc:"Arsenal gana Chelsea (1.55) × Over 2.5 Girona/Celta (1.90)",odds:2.945,stake:15,result:"win",pl:29.17,notes:"" },
  { id:"h6",date:"2026-03-03",type:"Combinada",desc:"Everton gana (1.61) × Liverpool gana (1.44) × Over 2.5 Como/Inter (2.25)",odds:5.22,stake:15,result:"loss",pl:-15.00,notes:"" },
  { id:"h7",date:"2026-03-04",type:"Combinada",desc:"Aston Villa DC X2 (1.57) × Arsenal gana Brighton (1.44) × Man City gana Forest (1.57)",odds:3.55,stake:15,result:"loss",pl:-15.00,notes:"" },
  { id:"h8",date:"2026-03-05",type:"Combinada",desc:"Lyon gana Coupe de France (2.55) × Over 2.5 (1.72)",odds:4.00,stake:15,result:"loss",pl:-15.00,notes:"" },
  { id:"h9",date:"2026-03-06",type:"Combinada",desc:"Elversberg gana (1.83) × Bayern HT Local (1.44) × Nancy DC X2 (1.44)",odds:3.80,stake:15,result:"cashout",pl:38.22,notes:"Cash out anticipado." },
  { id:"h10",date:"2026-03-07",type:"Combinada",desc:"Nantes U2.5 (1.61) × Man City gana FA Cup (2.05) × Swansea U2.5 (1.72)",odds:5.677,stake:15,result:"pending",pl:null,notes:"" },
];
function getResultStyle(r,pl){
  if(r==="win") return{text:"#5cb85c",bg:"rgba(92,184,92,0.07)",border:"rgba(92,184,92,0.18)",label:"Ganada",icon:"✓"};
  if(r==="loss") return{text:"#d9534f",bg:"rgba(217,83,79,0.07)",border:"rgba(217,83,79,0.18)",label:"Perdida",icon:"✗"};
  if(r==="pending") return{text:"#4a90c4",bg:"rgba(74,144,196,0.07)",border:"rgba(74,144,196,0.18)",label:"Pendiente",icon:"○"};
  if(r==="cashout"){
    if(pl==null) return{text:"#c9a84c",bg:"rgba(201,168,76,0.07)",border:"rgba(201,168,76,0.18)",label:"Cash Out",icon:"◈"};
    if(pl<0) return{text:"#e07060",bg:"rgba(224,112,96,0.07)",border:"rgba(224,112,96,0.18)",label:"Cash Out -",icon:"◈"};
    const ret=pl+15; if(ret>=13&&ret<=17) return{text:"#d4b84a",bg:"rgba(212,184,74,0.07)",border:"rgba(212,184,74,0.18)",label:"Cash Out ~",icon:"◈"};
    return{text:"#3eb58a",bg:"rgba(62,181,138,0.07)",border:"rgba(62,181,138,0.18)",label:"Cash Out +",icon:"◈"};
  }
  return{text:"#888",bg:"rgba(136,136,136,0.07)",border:"rgba(136,136,136,0.18)",label:r,icon:"."};
}
function isPos(b){return b.result==="win"||(b.result==="cashout"&&b.pl!=null&&b.pl>0);}
function computeStreak(s){
  let streak=0,st=null;
  for(let i=s.length-1;i>=0;i--){
    const pos=isPos(s[i]),neg=s[i].result==="loss"||(s[i].result==="cashout"&&s[i].pl!=null&&s[i].pl<=0);
    if(i===s.length-1){st=pos?"pos":neg?"neg":null;streak=st?1:0;}
    else{if((st==="pos"&&pos)||(st==="neg"&&neg))streak++;else break;}
  }
  return{streak,st};
}
function computeBankrolls(bets){
  let bank=INITIAL_BANKROLL;
  return bets.map(b=>{if(b.pl!=null){bank=parseFloat((bank+b.pl).toFixed(2));return{...b,bankroll:bank};}return{...b,bankroll:null};});
}
function getDB(bets){
  const s=bets.filter(b=>b.result!=="pending");
  const base=s.length>0?(s[s.length-1].bankroll||INITIAL_BANKROLL):INITIAL_BANKROLL;
  return parseFloat((base-bets.filter(b=>b.result==="pending").reduce((a,b)=>a+b.stake,0)).toFixed(2));
}
const fmtM=n=>n==null?"—":(n>=0?"+":"")+n.toFixed(2)+"€";
const fmtA=n=>n==null?"—":n.toFixed(2)+"€";
const fmtD=d=>new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"short"});
const CSS=`@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--bg:#0c0e18;--bg2:#111628;--bg3:#161b30;--surface:rgba(255,255,255,0.03);--border:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.10);--text:#d8dce8;--muted:rgba(160,168,188,0.5);--gold:#c9a84c;--gold2:#e8c96a;--cyan:#4a9fd4;--cyan2:#6bb8e8;--accent:#3a6fd8}html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;font-size:14px}#root{height:100%}::-webkit-scrollbar{width:0}input,textarea,button,select{font-family:'Inter',sans-serif}`;
function Sep(){return <div style={{height:1,background:"var(--border)"}}/>}
function Bdg({children,color,border,bg}){return <span style={{display:"inline-flex",alignItems:"center",padding:"2px 7px",borderRadius:3,background:bg||"rgba(255,255,255,0.05)",border:`1px solid ${border||"rgba(255,255,255,0.1)"}`,color:color||"#a0a8bc",fontSize:11,fontFamily:"'DM Mono',monospace",whiteSpace:"nowrap",lineHeight:1.6}}>{children}</span>;}
function RDot({result,pl,size=28}){const s=getResultStyle(result,pl);return <div style={{width:size,height:size,borderRadius:6,flexShrink:0,background:s.bg,border:`1px solid ${s.border}`,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{fontSize:size*0.45,color:s.text,fontWeight:600,lineHeight:1}}>{s.icon}</span></div>;}
function Header({bets}){
  const p=bets.filter(b=>b.result==="pending").length;
  return <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 18px",background:"var(--bg2)",borderBottom:"1px solid var(--border)",flexShrink:0}}>
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <img src={LOGO} style={{width:34,height:34,borderRadius:8,objectFit:"cover"}} alt="logo"/>
      <div><div style={{fontSize:16,fontWeight:600}}><span style={{color:"var(--gold2)"}}>Kairos</span><span style={{color:"var(--text)"}}>Bets</span></div><div style={{fontSize:10,color:"var(--muted)",letterSpacing:1.2,textTransform:"uppercase"}}>Value Tracker</div></div>
    </div>
    {p>0&&<Bdg color="#4a9fd4" border="rgba(74,144,196,0.3)">{p} en juego</Bdg>}
  </div>;
}
function Chart({bets,onClick}){
  const s=bets.filter(b=>b.result!=="pending"&&b.bankroll!=null);
  if(s.length<2)return <div style={{padding:20,color:"var(--muted)",fontSize:13,textAlign:"center"}}>Necesitas 2+ apuestas</div>;
  const W=360,H=200,P={t:16,r:16,b:28,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b;
  const pts=[{bankroll:INITIAL_BANKROLL},...s];
  const vs=pts.map(p=>p.bankroll),mn=Math.min(...vs),mx=Math.max(...vs),rng=mx-mn||1,pv=rng*0.12;
  const xS=i=>P.l+(i/(pts.length-1))*cW;
  const yS=v=>P.t+cH-((v-mn+pv)/(rng+pv*2))*cH;
  const lp=pts.map((p,i)=>`${i===0?"M":"L"} ${xS(i).toFixed(1)} ${yS(p.bankroll).toFixed(1)}`).join(" ");
  const ap=lp+` L ${xS(pts.length-1).toFixed(1)} ${(P.t+cH).toFixed(1)} L ${xS(0).toFixed(1)} ${(P.t+cH).toFixed(1)} Z`;
  const tv=Array.from({length:4},(_,i)=>mn-pv+((rng+pv*2)/3)*i);
  return <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:"block",overflow:"visible"}}>
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3a6fd8" stopOpacity="0.18"/><stop offset="100%" stopColor="#3a6fd8" stopOpacity="0"/></linearGradient><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stopColor="#3a6fd8"/><stop offset="100%" stopColor="#6bb8e8"/></linearGradient></defs>
    {tv.map((v,i)=><g key={i}><line x1={P.l} y1={yS(v)} x2={W-P.r} y2={yS(v)} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/><text x={P.l-6} y={yS(v)+4} textAnchor="end" fill="rgba(160,168,188,0.45)" fontSize="9">{Math.round(v)}</text></g>)}
    <line x1={P.l} y1={yS(INITIAL_BANKROLL)} x2={W-P.r} y2={yS(INITIAL_BANKROLL)} stroke="rgba(201,168,76,0.25)" strokeWidth="1" strokeDasharray="3,3"/>
    <path d={ap} fill="url(#ag)"/><path d={lp} fill="none" stroke="url(#lg)" strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round"/>
    {pts.map((p,i)=>{if(i===0)return <circle key={i} cx={xS(i)} cy={yS(p.bankroll)} r="3" fill="var(--bg2)" stroke="rgba(201,168,76,0.6)" strokeWidth="1.5"/>; const st=getResultStyle(p.result,p.pl); return <circle key={i} cx={xS(i)} cy={yS(p.bankroll)} r="5" fill="var(--bg2)" stroke={st.text} strokeWidth="1.8" style={{cursor:"pointer"}} onClick={()=>onClick(p)}/>;})}
    {pts.map((p,i)=>{if(i===0||i===pts.length-1||pts.length<=8||i%Math.ceil(pts.length/5)===0)return <text key={i} x={xS(i)} y={H-6} textAnchor="middle" fill="rgba(160,168,188,0.4)" fontSize="8">{i===0?"inicio":fmtD(p.date)}</text>; return null;})}
  </svg>;
}
function ChartTab({bets,onBet}){
  const [sel,setSel]=useState(null);
  const s=bets.filter(b=>b.result!=="pending");
  const tPL=s.reduce((a,b)=>a+(b.pl||0),0);
  const db=getDB(bets),roi=((db-INITIAL_BANKROLL)/INITIAL_BANKROLL*100);
  return <div style={{flex:1,overflow:"auto",display:"flex",flexDirection:"column"}}>
    <div style={{padding:"16px 18px 12px"}}><div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      <Bdg color="var(--gold)" border="rgba(201,168,76,0.25)">{fmtA(db)}</Bdg>
      <Bdg color={tPL>=0?"#5cb85c":"#d9534f"} border={tPL>=0?"rgba(92,184,92,0.3)":"rgba(217,83,79,0.3)"}>{fmtM(tPL)} neto</Bdg>
      <Bdg color={roi>=0?"var(--cyan)":"#d9534f"} border={roi>=0?"rgba(74,144,196,0.3)":"rgba(217,83,79,0.3)"}>{roi>=0?"+":""}{roi.toFixed(0)}% ROI</Bdg>
    </div></div><Sep/>
    <div style={{padding:"16px 14px 8px"}}>
      <div style={{fontSize:11,color:"var(--muted)",letterSpacing:1.4,textTransform:"uppercase",marginBottom:12}}>Bankroll · toca un punto</div>
      <Chart bets={bets} onClick={p=>setSel(sel?.id===p.id?null:p)}/>
    </div><Sep/>
    {sel&&<><div style={{padding:"12px 18px"}}><div onClick={()=>onBet(sel)} style={{padding:"13px 14px",borderRadius:9,cursor:"pointer",background:getResultStyle(sel.result,sel.pl).bg,border:`1px solid ${getResultStyle(sel.result,sel.pl).border}`}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:11,color:"var(--muted)"}}>{fmtD(sel.date)} · {sel.type}</span><Bdg color={getResultStyle(sel.result,sel.pl).text} border={getResultStyle(sel.result,sel.pl).border}>{getResultStyle(sel.result,sel.pl).label}</Bdg></div>
      <div style={{fontSize:13,color:"var(--text)",lineHeight:1.4,marginBottom:8}}>{sel.desc}</div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div style={{display:"flex",gap:6}}><Bdg>@{sel.odds}</Bdg><Bdg>€{sel.stake}</Bdg></div><span style={{fontSize:14,fontFamily:"'DM Mono',monospace",fontWeight:500,color:getResultStyle(sel.result,sel.pl).text}}>{fmtM(sel.pl)}</span></div>
    </div></div><Sep/></>
    }
    <div style={{padding:"8px 18px"}}><div style={{fontSize:11,color:"var(--muted)",letterSpacing:1.4,textTransform:"uppercase"}}>Todas las apuestas</div></div>
    {[...s].reverse().map((b,i)=>{const st=getResultStyle(b.result,b.pl);return <div key={b.id}><div onClick={()=>setSel(sel?.id===b.id?null:b)} style={{padding:"10px 18px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,background:sel?.id===b.id?st.bg:"transparent"}}><RDot result={b.result} pl={b.pl} size={26}/><div style={{flex:1,minWidth:0}}><div style={{fontSize:12,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{b.desc}</div><div style={{fontSize:10,color:"var(--muted)",marginTop:2}}>{fmtD(b.date)} · @{b.odds}</div></div><div style={{textAlign:"right",flexShrink:0}}><div style={{fontSize:13,fontFamily:"'DM Mono',monospace",color:st.text}}>{fmtM(b.pl)}</div>{b.bankroll&&<div style={{fontSize:10,color:"var(--muted)"}}>{fmtA(b.bankroll)}</div>}</div></div>{i<s.length-1&&<Sep/>}</div>;})}    
    <div style={{height:80}}/>
  </div>;
}
function Dashboard({bets,onNew,onBet}){
  const s=bets.filter(b=>b.result!=="pending");
  const wins=s.filter(b=>b.result==="win").length,losses=s.filter(b=>b.result==="loss").length,cos=s.filter(b=>b.result==="cashout").length;
  const tPL=s.reduce((a,b)=>a+(b.pl||0),0),db=getDB(bets),roi=((db-INITIAL_BANKROLL)/INITIAL_BANKROLL*100);
  const pend=bets.filter(b=>b.result==="pending");
  const {streak,st}=computeStreak(s),sc=st==="pos"?"#5cb85c":st==="neg"?"#d9534f":"var(--muted)";
  const recent=[...bets].reverse().slice(0,6);
  return <div style={{flex:1,overflow:"auto",display:"flex",flexDirection:"column"}}>
    <div style={{padding:"22px 18px 18px"}}>
      <div style={{fontSize:11,color:"var(--muted)",letterSpacing:1.4,textTransform:"uppercase",marginBottom:5}}>Bankroll disponible</div>
      <div style={{fontSize:44,fontFamily:"'DM Mono',monospace",fontWeight:500,letterSpacing:-1.5,color:"var(--text)",lineHeight:1}}>{fmtA(db)}</div>
      <div style={{display:"flex",gap:6,marginTop:10,flexWrap:"wrap"}}>
        <Bdg color="var(--gold)" border="rgba(201,168,76,0.25)">base €{INITIAL_BANKROLL}</Bdg>
        <Bdg color={tPL>=0?"#5cb85c":"#d9534f"} border={tPL>=0?"rgba(92,184,92,0.3)":"rgba(217,83,79,0.3)"}>{fmtM(tPL)} neto</Bdg>
        <Bdg color={roi>=0?"var(--cyan)":"#d9534f"} border={roi>=0?"rgba(74,144,196,0.3)":"rgba(217,83,79,0.3)"}>{roi>=0?"+":""}{roi.toFixed(0)}% ROI</Bdg>
      </div>
      {pend.length>0&&<div style={{fontSize:12,color:"var(--muted)",marginTop:8,fontStyle:"italic"}}>€{pend.reduce((a,b)=>a+b.stake,0)} en juego</div>}
    </div><Sep/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)"}}>
      {[{l:"Ganadas",v:wins,c:"#5cb85c"},{l:"Perdidas",v:losses,c:"#d9534f"},{l:"C.Out",v:cos,c:"#3eb58a"},{l:"Racha",v:streak>0?`${streak}${st==="pos"?"W":"L"}`:"—",c:sc}].map((x,i)=>(
        <div key={x.l} style={{padding:"14px 8px",textAlign:"center",borderRight:i<3?"1px solid var(--border)":"none",background:"var(--bg2)"}}>
          <div style={{fontSize:24,fontFamily:"'DM Mono',monospace",fontWeight:500,color:x.c,lineHeight:1}}>{x.v}</div>
          <div style={{fontSize:10,color:"var(--muted)",marginTop:4,letterSpacing:0.5,textTransform:"uppercase"}}>{x.l}</div>
        </div>
      ))}
    </div><Sep/>
    {pend.length>0&&<><div style={{padding:"14px 18px 8px"}}><div style={{fontSize:11,color:"var(--muted)",letterSpacing:1.4,textTransform:"uppercase",marginBottom:10}}>En juego</div>
      {pend.map(b=><div key={b.id} onClick={()=>onBet(b)} style={{padding:"11px 13px",borderRadius:8,marginBottom:6,cursor:"pointer",background:"rgba(74,144,196,0.07)",border:"1px solid rgba(74,144,196,0.18)",display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12}}>
        <div style={{flex:1,minWidth:0}}><div style={{fontSize:11,color:"var(--muted)",marginBottom:3}}>{fmtD(b.date)} · {b.type}</div><div style={{fontSize:13,color:"var(--text)",lineHeight:1.4}}>{b.desc}</div></div>
        <Bdg color="var(--cyan)" border="rgba(74,144,196,0.3)">@{b.odds}</Bdg>
      </div>)}
    </div><Sep/></>
    }
    <div style={{padding:"14px 18px 8px"}}><div style={{fontSize:11,color:"var(--muted)",letterSpacing:1.4,textTransform:"uppercase"}}>Recientes</div></div>
    {recent.map((b,i)=><div key={b.id}><div onClick={()=>onBet(b)} style={{padding:"11px 18px",cursor:"pointer",display:"flex",alignItems:"center",gap:12}}>
      <RDot result={b.result} pl={b.pl}/>
      <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,color:"var(--text)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:2}}>{b.desc}</div><div style={{fontSize:11,color:"var(--muted)"}}>{fmtD(b.date)} · @{b.odds}</div></div>
      <div style={{fontFamily:"'DM Mono',monospace",fontWeight:500,fontSize:13,color:b.result==="pending"?"var(--muted)":getResultStyle(b.result,b.pl).text,flexShrink:0}}>{b.result==="pending"?"—":fmtM(b.pl)}</div>
    </div>{i<recent.length-1&&<Sep/>}</div>)}
    <div style={{height:90}}/>
    <div style={{position:"absolute",bottom:76,right:18}}><button onClick={onNew} style={{width:50,height:50,borderRadius:12,background:"linear-gradient(145deg,var(--accent),var(--cyan))",border:"none",color:"#fff",fontSize:22,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>+</button></div>
  </div>;
}
function History({bets,onBet}){
  const s=[...bets].reverse();
  const tPL=bets.filter(b=>b.pl!=null).reduce((a,b)=>a+(b.pl||0),0);
  return <div style={{flex:1,overflow:"auto"}}>
    <div style={{padding:"14px 18px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{fontSize:11,color:"var(--muted)",letterSpacing:1.4,textTransform:"uppercase"}}>{bets.length} apuestas</div>
      <div style={{fontSize:13,fontFamily:"'DM Mono',monospace",color:tPL>=0?"#5cb85c":"#d9534f"}}>{fmtM(tPL)}</div>
    </div><Sep/>
    {s.map((b,i)=>{const st=getResultStyle(b.result,b.pl);return <div key={b.id}><div onClick={()=>onBet(b)} style={{padding:"12px 18px",cursor:"pointer",display:"flex",gap:12,alignItems:"flex-start"}}>
