// === Google Gemini AI Service ===
const GEMINI_MODEL="gemini-2.5-flash";
const AI_KEY_STORE="kairosbets_gemini_key";
const getAK=()=>localStorage.getItem(AI_KEY_STORE)||"";
const setAK=k=>localStorage.setItem(AI_KEY_STORE,k.trim());
const hasAK=()=>!!getAK();

async function callGemini(parts,{temperature=0.3,jsonMode=false}={}){
  const key=getAK();if(!key)throw new Error("API key de Gemini no configurada");
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${key}`;
  const genCfg={temperature,maxOutputTokens:4096};
  if(jsonMode)genCfg.responseMimeType="application/json";
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts}],generationConfig:genCfg})});
  if(!res.ok){const err=await res.text();throw new Error(`Gemini error ${res.status}: ${err}`);}
  const data=await res.json();
  const txt=data.candidates[0].content.parts.filter(p=>p.text).map(p=>p.text).join("");
  return txt;
}
function fileToB64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(file);})}
function cleanJSON(s){s=s.replace(/```json\n?/g,"").replace(/```\n?/g,"").trim();const m=s.match(/\{[\s\S]*\}/);return m?m[0]:s;}

const BET_FORMAT_PROMPT=`FORMATO OBLIGATORIO para "desc" — sigue EXACTAMENTE este patrón:
- Separar patas con " × "
- Cada pata: "Equipo mercado (cuota)"
- Mercados: "gana", "pierde", "empate", "DC X2", "DC 1X", "Over 2.5", "U2.5", "O2.5", "BTTS", "HT Local", "+3.5", etc.
- Cuotas SIEMPRE con exactamente 2 decimales (1.50, no 1.5)
- CUOTA TOTAL ("odds") = multiplicación de TODAS las cuotas individuales, redondeada a 2 decimales

EJEMPLOS de desc correctas:
- "Burton gana (3.20) × Bradford empate (3.50) × Inter empate descanso (3.20)"
- "Liverpool BTTS (1.61) × Barcelona +3.5 (1.66) × Man City gana (1.66)"
- "Nantes U2.5 (1.61) × Man City gana FA Cup (2.05) × Swansea U2.5 (1.72)"
- "Arsenal gana Chelsea (1.55) × Over 2.5 Girona/Celta (1.90)"
- "Wrexham O2.5 (1.80) × Stoke U2.5 (1.90) × Sheffield U2.5 (1.80)"`;

async function parseBetScreenshot(file,onStatus){
  onStatus&&onStatus("Analizando imagen con IA...");
  const b64=await fileToB64(file);
  const mime=file.type||"image/jpeg";
  const today=new Date().toISOString().split("T")[0];
  const prompt=`Mira esta captura de pantalla de una apuesta deportiva (Bet365, Betfair, etc).

INSTRUCCIONES CRÍTICAS:
1. Identifica TODAS las selecciones/patas de la apuesta. NO te dejes ninguna. Mira la imagen entera.
2. Cada pata tiene: un partido, un mercado y una cuota decimal.
3. STAKE: busca el importe apostado. Si no lo ves, pon 15.
4. FECHA: busca fechas de los partidos. Si no hay, usa "${today}".

${BET_FORMAT_PROMPT}

Devuelve SOLO JSON válido, sin explicaciones ni markdown:
{"type":"Simple" o "Combinada","desc":"...","odds":numero_2_decimales,"stake":numero,"date":"YYYY-MM-DD","notes":""}`;

  const content=await callGemini([
    {inline_data:{mime_type:mime,data:b64}},
    {text:prompt}
  ],{temperature:0.1,jsonMode:true});
  try{return JSON.parse(cleanJSON(content));}catch{throw new Error("No se pudo parsear: "+content);}
}

async function parseBetText(text){
  const today=new Date().toISOString().split("T")[0];
  const prompt=`El usuario quiere registrar una apuesta deportiva. Interpreta este texto:

"${text}"

${BET_FORMAT_PROMPT}

Si no dice stake, pon 15. Si no dice fecha, usa "${today}".

Devuelve SOLO JSON válido:
{"type":"Simple" o "Combinada","desc":"...","odds":numero_2_decimales,"stake":numero,"date":"YYYY-MM-DD","notes":""}`;
  const content=await callGemini([{text:prompt}],{jsonMode:true});
  try{return JSON.parse(cleanJSON(content));}catch{throw new Error("No se pudo parsear: "+content);}
}

async function aiAnalyze(bets){
  const settled=bets.filter(b=>b.result!=="pending").map(b=>({date:b.date,type:b.type,desc:b.desc,odds:b.odds,stake:b.stake,result:b.result,pl:b.pl}));
  const prompt=`Eres analista experto de apuestas deportivas. Analiza este historial EN ESPAÑOL.
Historial: ${JSON.stringify(settled)}
Devuelve SOLO JSON válido:
{"resumen":"2-3 frases","stats":{"totalBets":N,"wins":N,"losses":N,"cashouts":N,"winRate":"X%","roi":"X%","totalPL":N,"avgOdds":N},"mejoresMercados":[{"mercado":"nombre","record":"W-L","pl":N,"nota":"breve"}],"peoresMercados":[{"mercado":"nombre","record":"W-L","pl":N,"nota":"breve"}],"diasSemana":[{"dia":"nombre","bets":N,"wins":N,"pl":N}],"ligas":[{"liga":"nombre","bets":N,"wins":N,"pl":N}],"rachas":"descripción","insights":["1","2","3"],"recomendaciones":["1","2","3"]}
Sé específico. Identifica ligas por nombres de equipos.`;
  const content=await callGemini([{text:prompt}],{temperature:0.4,jsonMode:true});
  try{return JSON.parse(cleanJSON(content));}catch{throw new Error("No se pudo parsear análisis: "+content);}
}

async function aiWeekly(bets){
  const settled=bets.filter(b=>b.result!=="pending");
  const now=new Date(),weekAgo=new Date(now.getTime()-7*24*60*60*1000);
  const week=settled.filter(b=>new Date(b.date+"T12:00:00")>=weekAgo);
  if(!week.length)return{empty:true,message:"No hay apuestas resueltas en los últimos 7 días."};
  const ws=week.map(b=>({date:b.date,type:b.type,desc:b.desc,odds:b.odds,stake:b.stake,result:b.result,pl:b.pl}));
  const all=settled.map(b=>({date:b.date,result:b.result,pl:b.pl,odds:b.odds}));
  const prompt=`Eres periodista deportivo. Escribe crónica de apuestas en ESPAÑOL, ameno y profesional.
Semana: ${JSON.stringify(ws)}
Historial: ${JSON.stringify(all)}
Devuelve SOLO JSON válido:
{"titular":"máx 60 chars estilo prensa","subtitulo":"balance semana","cronica":"3-5 párrafos contando cada apuesta, partidos, resultados, sorpresas","balance":{"apuestas":N,"ganadas":N,"perdidas":N,"cashouts":N,"pl":N,"roi":"X%"},"mejorApuesta":"cuál y por qué","peorApuesta":"cuál y por qué","leccion":"qué mejorar","perspectiva":"tendencia y ajustes"}`;
  const content=await callGemini([{text:prompt}],{temperature:0.6,jsonMode:true});
  try{return JSON.parse(cleanJSON(content));}catch{throw new Error("No se pudo generar reporte: "+content);}
}

function Logo({size=36}){
  return(
    <img src="public/icons/icon-192.png" width={size} height={size}
      style={{borderRadius:Math.round(size*0.2),flexShrink:0,objectFit:"cover"}}

function getS(r,pl){
  if(r==="win")return{t:"#5cb85c",bg:"rgba(92,184,92,0.07)",bd:"rgba(92,184,92,0.18)",l:"Ganada",i:"✓"};
  if(r==="loss")return{t:"#d9534f",bg:"rgba(217,83,79,0.07)",bd:"rgba(217,83,79,0.18)",l:"Perdida",i:"✗"};
  if(r==="pending")return{t:"#4a90c4",bg:"rgba(74,144,196,0.07)",bd:"rgba(74,144,196,0.18)",l:"Pendiente",i:"○"};
  if(r==="cashout"){
    if(pl==null)return{t:"#c9a84c",bg:"rgba(201,168,76,0.07)",bd:"rgba(201,168,76,0.18)",l:"Cash Out",i:"◈"};
    if(pl<0)return{t:"#e07060",bg:"rgba(224,112,96,0.07)",bd:"rgba(224,112,96,0.18)",l:"Cash Out -",i:"◈"};
    const ret=pl+15;if(ret>=13&&ret<=17)return{t:"#d4b84a",bg:"rgba(212,184,74,0.07)",bd:"rgba(212,184,74,0.18)",l:"Cash Out ~",i:"◈"};
    return{t:"#3eb58a",bg:"rgba(62,181,138,0.07)",bd:"rgba(62,181,138,0.18)",l:"Cash Out +",i:"◈"};
  }
  return{t:"#888",bg:"rgba(136,136,136,0.07)",bd:"rgba(136,136,136,0.18)",l:r,i:"."};
}
function isPos(b){return b.result==="win"||(b.result==="cashout"&&b.pl!=null&&b.pl>0);}
function computeStreak(s){
  let streak=0,st=null;
  for(let i=s.length-1;i>=0;i--){
    const pos=isPos(s[i]),neg=s[i].result==="loss"||(s[i].result==="cashout"&&s[i].pl!=null&&s[i].pl<=0);
    if(i===s.length-1){st=pos?"pos":neg?"neg":null;streak=st?1:0;}
    else{if((st==="pos"&&pos)||(st==="neg"&&neg))streak++;else break;}
  }
  return{streak,st};
}
function computeBankrolls(bets){
  let bank=INITIAL_BANKROLL;
  return bets.map(b=>{if(b.pl!=null){bank=parseFloat((bank+b.pl).toFixed(2));return{...b,bankroll:bank};}return{...b,bankroll:null};});
}
function getDB(bets){
  const s=bets.filter(b=>b.result!=="pending");
  const base=s.length>0?(s[s.length-1].bankroll||INITIAL_BANKROLL):INITIAL_BANKROLL;
  return parseFloat((base-bets.filter(b=>b.result==="pending").reduce((a,b)=>a+b.stake,0)).toFixed(2));
}
const fmtM=n=>n==null?"—":(n>=0?"+":"")+n.toFixed(2)+"€";
const fmtA=n=>n==null?"—":n.toFixed(2)+"€";
const fmtD=d=>new Date(d+"T12:00:00").toLocaleDateString("es-ES",{day:"2-digit",month:"short"});

function Sep(){return <div style={{height:1,background:"var(--border)"}}/>}
function Bdg({children,color,border}){

function Chart({bets,onClick}){
  const settled=bets.filter(b=>b.result!=="pending"&&b.bankroll!=null);
  if(settled.length<2)return <div style={{padding:20,color:"var(--muted)",fontSize:13,textAlign:"center"}}>Necesitas 2+ apuestas liquidadas</div>;
  const W=360,H=200,P={t:16,r:16,b:28,l:48},cW=W-P.l-P.r,cH=H-P.t-P.b;
  const pts=[{bankroll:INITIAL_BANKROLL},...settled];
  const vs=pts.map(p=>p.bankroll),mn=Math.min(...vs),mx=Math.max(...vs),rng=mx-mn||1,pv=rng*0.12;
  const xS=i=>P.l+(i/(pts.length-1))*cW,yS=v=>P.t+cH-((v-mn+pv)/(rng+pv*2))*cH;
  const lp=pts.map((p,i)=>`${i===0?"M":"L"} ${xS(i).toFixed(1)} ${yS(p.bankroll).toFixed(1)}`).join(" ");
  const ap=lp+` L ${xS(pts.length-1).toFixed(1)} ${(P.t+cH).toFixed(1)} L ${xS(0).toFixed(1)} ${(P.t+cH).toFixed(1)} Z`;
  const tv=Array.from({length:4},(_,i)=>mn-pv+((rng+pv*2)/3)*i);
  return(
    <svg viewBox={`0 0 ${W} ${H}`} width="100%" style={{display:"block",overflow:"visible"}}>
      <defs>
        <linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#3a6fd8" stopOpacity="0.18"/><stop offset="100%" stopColor="#3a6fd8" stopOpacity="0"/></linearGradient>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stopColor="#3a6fd8"/><stop offset="100%" stopColor="#6bb8e8"/></linearGradient>
      </defs>
      {tv.map((v,i)=>(<g key={i}><line x1={P.l} y1={yS(v)} x2={W-P.r} y2={yS(v)} stroke="rgba(255,255,255,0.05)" strokeWidth="1"/><text x={P.l-6} y={yS(v)+4} textAnchor="end" fill="rgba(160,168,188,0.45)" fontSize="9">{Math.round(v)}</text></g>))}
      <line x1={P.l} y1={yS(INITIAL_BANKROLL)} x2={W-P.r} y2={yS(INITIAL_BANKROLL)} stroke="rgba(201,168,76,0.25)" strokeWidth="1" strokeDasharray="3,3"/>
      <path d={ap} fill="url(#ag)"/><path d={lp} fill="none" stroke="url(#lg)" strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round"/>
      {pts.map((p,i)=>{if(i===0)return <circle key={i} cx={xS(i)} cy={yS(p.bankroll)} r="3" fill="var(--bg2)" stroke="rgba(201,168,76,0.6)" strokeWidth="1.5"/>;const s=getS(p.result,p.pl);return <circle key={i} cx={xS(i)} cy={yS(p.bankroll)} r="5" fill="var(--bg2)" stroke={s.t} strokeWidth="1.8" style={{cursor:"pointer"}} onClick={()=>onClick&&onClick(p)}/>;})}
      {pts.map((p,i)=>{if(i===0||i===pts.length-1||pts.length<=8||i%Math.ceil(pts.length/5)===0)return <text key={i} x={xS(i)} y={H-6} textAnchor="middle" fill="rgba(160,168,188,0.4)" fontSize="8">{i===0?"inicio":fmtD(p.date)}</text>;return null;})}
    </svg>
  );
}

        <div style={{display:"flex",width:`${TABS.length*100}%`,height:"100%",transform:`translateX(calc(-${idx*(100/TABS.length)}% + ${drag/TABS.length}px))`,transition:drag===0?"transform 0.3s cubic-bezier(0.4,0,0.2,1)":"none"}}>
          {TABS.map(t=>(<div key={t} style={{width:`${100/TABS.length}%`,height:"100%",flexShrink:0,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            {t==="dashboard"&&<Dashboard bets={bets} onNew={()=>setView("newbet")} onBet={openBet}/>}
            {t==="chart"&&<ChartTab bets={bets} onBet={openBet}/>}
            {t==="history"&&<History bets={bets} onBet={openBet}/>}
            {t==="ai"&&<AITab bets={bets} onSettings={()=>setView("settings")}/>}
          </div>))}
        </div>
      </div>)}
      {view==="detail"&&sel&&(<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}><Detail bet={sel} onBack={()=>{setView("main");setSel(null);}} onUpdate={u=>{const nb=[...bets];nb[nb.findIndex(x=>x.id===u.id)]=u;persist(nb);}} onDelete={id=>{persist(bets.filter(x=>x.id!==id));setSel(null);}}/></div>)}
      {view==="newbet"&&(<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}><NewBet onBack={()=>setView("main")} onSave={b=>{persist([...bets,b]);setView("main");}}/></div>)}
      {view==="settings"&&(<div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}><SettingsView onBack={()=>{setView("main");setTab("ai");}}/></div>)}
      {view==="main"&&<TabBar active={tab} onChange={setTab}/>}
    </div></>);
}
window.App=App;
  </script>
  <script>
    window.addEventListener('DOMContentLoaded',function(){
      ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.App));
      setTimeout(function(){var s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(function(){if(s.parentNode)s.parentNode.removeChild(s);},400);}},900);
    });
    if('serviceWorker' in navigator){navigator.serviceWorker.register('public/sw.js').catch(function(){});}
  </script>
</body>
</html>
