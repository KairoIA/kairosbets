<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0e18" />
  <meta name="description" content="KairosBets — Value Betting Tracker" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KairosBets" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <title>KairosBets</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root {
      height: 100%; height: 100dvh;
      background: #0c0e18;
      overflow: hidden;
    }
    #splash {
      position: fixed; inset: 0;
      background: #0c0e18;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      z-index: 9999; transition: opacity 0.4s;
    }
    #splash img { width: 96px; height: 96px; border-radius: 22px; }
    #splash p { color: rgba(255,255,255,0.3); font-family: sans-serif; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="/icons/icon-192.png" alt="KairosBets" />
    <p>Cargando...</p>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    window.addEventListener('load', () => {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
      setTimeout(() => {
        const s = document.getElementById('splash');
        if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 400); }
      }, 800);
    });
  </script>
</body>
</html>
